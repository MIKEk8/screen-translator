name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - run: dotnet restore
      - run: dotnet build -c Release --no-restore
      - run: dotnet test -c Release --no-build --no-restore

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Publish
        run: >
          dotnet publish src/ScreenTranslator.App -c Release -r win-x64 --self-contained
          -o publish
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:PublishTrimmed=true
          -p:TrimMode=partial
          -p:SuppressTrimAnalysisWarnings=true
          -p:_SuppressWinFormsTrimError=true
          -p:_SuppressWpfTrimError=true
          -p:DebugType=none

      - name: Create archive
        run: Compress-Archive -Path publish/* -DestinationPath ScreenTranslator-${{ github.ref_name }}-win-x64.zip

      - uses: softprops/action-gh-release@v2
        with:
          files: ScreenTranslator-${{ github.ref_name }}-win-x64.zip
          generate_release_notes: true
